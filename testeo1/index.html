<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulación de luz 2D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <h1>Simulación de luz 2D</h1>
  <p class="hint">Mueve al jugador con WASD o las flechas. Arrastra luces y objetos. Doble clic en el suelo añade una luz; Suprimir borra lo seleccionado.</p>

  <p class="sec">Luz seleccionada</p>
  <label>Color</label>
  <input type="color" id="color" value="#ffb347">
  <label>Alcance <b id="vR"></b></label>
  <input type="range" id="radius" min="80" max="1200" value="420">
  <label>Intensidad <b id="vI"></b></label>
  <input type="range" id="intensity" min="0.1" max="1.5" step="0.05" value="1">

  <hr>
  <label>Luz ambiente <b id="vA"></b></label>
  <input type="range" id="ambient" min="0" max="0.6" step="0.01" value="0.07">
  <label>Suavidad de sombras <b id="vB"></b></label>
  <input type="range" id="blur" min="0" max="12" step="1" value="3">
  <label class="check"><input type="checkbox" id="flicker"> Parpadeo de llama</label>
  <label class="check"><input type="checkbox" id="showRays" checked> Mostrar raycast (1 por luz)</label>
  <label class="check"><input type="checkbox" id="showAABB"> Mostrar cajas AABB</label>

  <div class="row">
    <button id="addLight">+ Luz</button>
    <button id="addBox">+ Caja</button>
    <button id="addTri">+ Triángulo</button>
    <button id="addCircle">+ Círculo</button>
  </div>
  <div class="row"><button id="reset">Reiniciar escena</button></div>
</div>

<div id="hud">
  <div class="state" id="hState">En sombra</div>
  <div><span>Luces que lo tocan:</span> <b id="hN">0</b></div>
  <div><span>Veces tocado:</span> <b id="hC">0</b></div>
  <div><span>Tiempo en luz:</span> <b id="hT">0.0</b> s</div>
</div>

<script src="script.js"></script>
</body>
</html>
